<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- import CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
  <script src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
</head>
<body>
  <div id="app">
    <div class="demo-input-suffix">
        买单输入：
        <el-input
        placeholder="请输入价格"
        v-model="buyPrice"
        clearable>
        </el-input>
        <el-input
        placeholder="请输入数量"
        v-model="buyQuantity"
        clearable>
        </el-input>
    </div>

    <div class="demo-input-suffix">
        卖单输入：
        <el-input
        placeholder="请输入价格"
        v-model="sellPrice"
        clearable>
        </el-input>
        <el-input
        placeholder="请输入数量"
        v-model="sellQuantity"
        clearable>
        </el-input>
    </div>


    <el-button @click="submitOrder">提交委托</el-button>
    <!-- <el-dialog :visible.sync="visible" title="Hello world">
      <p>Try Element</p>
    </el-dialog> -->
    <div>
        {{responseMessage}}
    </div>
  </div>
</body>
  <!-- import Vue before Element -->
  <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
  <!-- import JavaScript -->
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: function() {
        return { 
            buyPrice : null,
            buyQuantity : null,
            sellPrice : null,
            sellQuantity : null,
            responseMessage: "",
         }
      },
      methods: {
        submitOrder(){
            let side = 1;
            let userId = 1;
            let price = this.buyPrice;
            let quantity = this.buyQuantity;
            if (this.sellPrice > 0) {
                side = 2;
                userId = 2;
                price = this.sellPrice;
                quantity = this.sellQuantity;
            }
            const vm = this
            $.ajax({
                url:"http://192.168.1.5:30013/order/create",
                type: 'POST',
                contentType: 'application/json; charset=UTF-8',
                dataType: 'json',
                data: JSON.stringify({
                    userId: userId,
                    symbolId: 1,
                    side: side,
                    type: 1,
                    price: price,
                    quantity: quantity
                }),
                success:function(result){
                    console.log(result);
                    vm.responseMessage = result.data
                    vm.buyPrice = null;
                    vm.buyQuantity = null;
                    vm.sellPrice = null;
                    vm.sellQuantity = null;
                }
            });
        }
      }
    })
  </script>
</html>
