server:
  port: 30019

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: a5b3e180-7db4-4201-aa49-ef3ca8bbab0a
        group: my-cloud

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: service-matching-engine
          uri: lb://service-matching-engine
          predicates:
            - Path=/api/service-matching-engine/**
          filters:
            - StripPrefix=2
        - id: service-order
          uri: lb://service-order
          predicates:
            - Path=/api/service-order/**
          filters:
            - StripPrefix=2

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG
